<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat · Neuron Explorer</title>
<link rel="stylesheet" href="style.css?v=75">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23151515%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23ffd27a%22/%3E%3C/svg%3E">
</head>
<body class="chat-page">
<header>
  <a id="to-explorer" class="hbtn" href="/" target="neuron-explorer" title="the map, the list and the neuron panel (opens the explorer tab if it is already open)">‹ Explorer</a>
  <span id="ch-focus"></span>
  <span id="status" class="mono"></span>
</header>
<main class="chat-main">
  <section class="pane" id="pane-steer">
    <nav class="pane-tabs"><button data-pane="chat" class="on">Steering chat</button><button data-pane="variants">Variants</button></nav>
    <div id="tab-chat" class="tab on">
      <div id="c-lens"></div>
      <div id="c-thread"></div>
      <div id="c-reads"></div>
      <form id="c-form">
        <div class="c-bar">
          <span class="seg" id="c-dir"><button type="button" data-d="writes" class="on" title="steer the model with the neurons below and compare replies">Steer</button><button type="button" data-d="reads" title="show the open neuron's activation on each token of your text">Read activations</button></span>
          <label class="c-max" title="the longest reply, in tokens; steered replies often repeat until they reach it. About 5 tokens a second on this CPU: 600 ≈ 2 min, 2400 ≈ 8 min, 9600 ≈ 32 min. Stop ends a run early.">Length <select id="c-max"><option>150</option><option>300</option><option>600</option><option>1200</option><option>2400</option><option>4800</option><option>9600</option><option value="32768">32k (until it ends)</option></select></label>
          <span class="toggles"><button type="button" id="c-compare" title="also generate the reply without the steering and with the steering reversed, side by side">Compare</button></span>
          <button type="button" id="c-save" class="ghost" title="save this steering setup to Variants">Save as variant</button>
          <button type="button" id="c-clear" class="ghost">Clear chat</button>
        </div>
        <div id="steer-panel">
          <div class="c-head">
            <span class="c-title" title="every neuron here is pushed together; the − column reverses each push">Steering</span>
            <span id="c-sum" class="mono"></span>
            <span class="seg" id="c-mode"><button type="button" data-m="add" class="on" title="add: push each neuron by its dose × the layer's median residual norm">add</button><button type="button" data-m="mul" title="×: multiply each neuron's own activation by its dose">×</button></span>
            <button type="button" id="c-reset" class="ghost" title="back to just the open neuron">Reset</button>
            <button type="button" id="c-fold" class="ghost"></button>
          </div>
          <div id="c-stack"></div>
          <div class="c-addrow"><input id="c-add" placeholder="Add a neuron, e.g. L17 N63" aria-label="add a neuron to steer" spellcheck="false" autocomplete="off"><button type="button" id="c-add-open" class="ghost" hidden></button></div>
        </div>
        <div class="row"><input id="c-input" placeholder="Who are you?" autocomplete="off" aria-label="prompt"><button id="c-go" type="submit">Run</button></div>
      </form>
    </div>
    <div id="tab-variants" class="tab">
      <form id="v-save">
        <input id="v-name" placeholder="Name the current steering setup" aria-label="variant name" spellcheck="false" autocomplete="off">
        <button type="submit">Save</button>
      </form>
      <div id="v-current" class="dim"></div>
      <ul id="v-list"></ul>
    </div>
  </section>
  <div id="split" role="separator" aria-orientation="vertical" aria-label="resize the chat panes" aria-valuemin="20" aria-valuemax="80" tabindex="0" title="drag to resize · double-click to reset"></div>
  <section class="pane" id="pane-claude">
    <nav class="pane-tabs"><span class="pane-title" id="a-title">Claude</span><span id="a-ctx" hidden></span><select id="a-agent" class="dim" title="agent for new conversations"><option value="claude">claude</option><option value="codex">codex</option></select><button id="a-past" class="dim" title="past conversations">Past</button><button id="a-new" class="dim" title="start a new conversation">New</button></nav>
    <div id="tab-claude" class="tab on">
      <div id="a-thread"><div class="a-empty dim">Ask anything about the model, or open a neuron and press <b>explain</b>.</div></div>
      <div id="a-actions"></div>
      <div id="a-files"></div>
      <form id="a-form"><button id="a-attach" type="button" title="attach files (or drop / paste them)" aria-label="attach">+</button><input id="a-file" type="file" multiple hidden><textarea id="a-input" rows="1" placeholder="Ask Claude…" title="while Claude works: Enter interrupts and sends, ⌘/Ctrl+Enter queues" spellcheck="false"></textarea><button id="a-send" type="submit" aria-label="send">↑</button></form>
    </div>
  </section>
</main>
<script type="module" src="chat.js?v=6"></script>
</body>
</html>
